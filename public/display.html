<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Added to the Home Screen, the stage launches without browser chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Saints Stage" />
  <meta name="theme-color" content="#14121f" />
  <title>Saints of the Isles · Stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.88em' font-size='58'%3E%E2%9C%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="vellum"></div>
  <main class="display" id="display">
    <div class="aura"></div>
    <div class="rays" id="rays"></div>

    <!-- Idle invitation: a constellation of saints drifting behind the title -->
    <section class="invite" id="invite">
      <div class="invite__float" id="inviteFloat" aria-hidden="true"></div>
      <div class="invite__center">
        <div class="invite__mark" aria-hidden="true">✠</div>
        <h1>Saints of the Isles</h1>
        <p>Choose a place on the visitor map to meet the saint connected to it</p>
        <div class="invite__quote" id="inviteQuote" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Saint reveal (filled by display.js) -->
    <section class="saint" id="saint" aria-live="polite" aria-hidden="true"></section>

    <div class="display__foot">
      <span class="lamp" data-conn-status><span class="lamp__text">Map</span></span>
    </div>

  </main>

  <script src="/saints.js"></script>
  <script src="/connection.js"></script>
  <script src="/display.js"></script>
</body>
</html>
