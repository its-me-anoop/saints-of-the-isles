<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Saints of the Isles · Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.88em' font-size='58'%3E%E2%9C%A0%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="vellum"></div>
  <main class="tablet">
    <header class="tablet__bar">
      <h1 class="tablet__title"><span aria-hidden="true">✠</span> Saints of the Isles</h1>
      <div class="viewtoggle" role="tablist" aria-label="View">
        <button class="viewtoggle__btn is-active" id="viewMap" role="tab" aria-selected="true" aria-controls="mapwrap">Map</button>
        <button class="viewtoggle__btn" id="viewList" role="tab" aria-selected="false" aria-controls="listview">Saints list</button>
      </div>
    </header>

    <section class="tablet__stage">
      <div class="mapwrap" id="mapwrap" data-conn-status role="tabpanel" aria-labelledby="viewMap">
        <!-- SVG map injected by tablet.js -->
        <div class="preview" id="preview" aria-hidden="true"></div>
        <button class="zoomreset" id="zoomReset" aria-hidden="true" hidden>Reset map view</button>
        <div class="maphint" id="mapHint">Touch a place to meet its saint. Drag to explore.</div>
      </div>

      <div class="listview" id="listview" role="tabpanel" aria-labelledby="viewList" hidden></div>

      <div class="nowshowing" id="nowshowing" role="status" aria-live="polite"></div>

      <div class="tablet__foot">
        <span class="lamp" data-conn-status><span class="lamp__text">Big screen</span></span>
        <div class="nowchip" id="nowchip" hidden aria-live="polite">
          <span class="nowchip__img" id="nowchipImg"></span>
          <span><span class="nowchip__label">On display</span><span class="nowchip__name" id="nowchipName"></span></span>
        </div>
        <div class="tablet__controls">
          <button class="iconbtn iconbtn--gold" id="surprise">Discover a saint</button>
          <button class="reset" id="reset">Clear the screen</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/saints.js"></script>
  <script src="/map.js"></script>
  <script src="/connection.js"></script>
  <script src="/tablet.js"></script>
</body>
</html>
